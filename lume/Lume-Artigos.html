<body><a class="skip" href="#main">Pular para o conteúdo</a><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"><div id="dialog-content"></div></dialog><script>/**
 * Lume's dependency-free study engine.
 * Local mode selects evidence and teaches how to read it; it does not claim to
 * understand or translate findings. An AI guide can be imported separately.
 */

const MAX_ARTICLE_LENGTH = 1000000;
const fold = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const compact = value => value.replace(/\s+/g, ' ').trim();
const unique = values => [...new Set(values)];

const CATEGORIES = {
  abstract: /^(?:resumo|abstract|summary|resumen)\b/,
  objective: /^(?:objetivos?|objectives?|aims?|proposito|finalidade)\b/,
  context: /^(?:introducao|introduction|contexto|fundamentacao|background|referencial teorico)\b/,
  method: /^(?:metodos?|methods?|metodologia|methodology|materiais e metodos|materials and methods|participantes|participants|procedimentos?|procedures?|desenho do estudo)\b/,
  results: /^(?:resultados?|results?|achados|findings)\b/,
  limits: /^(?:limitacoes|limitations?|limites do estudo|pontos fortes e limitacoes)\b/,
  discussion: /^(?:discussao|discussion|conclusoes?|conclusions?|consideracoes finais)\b/,
};

function articleInput(text) {
  if (typeof text !== 'string' || !text.trim()) throw new Error('Adicione o texto do artigo para começar.');
  if (text.length > MAX_ARTICLE_LENGTH) throw new Error('O artigo é muito extenso. Divida o texto em partes de até 1 milhão de caracteres.');
  return text.trim();
}

function categoryForHeading(line) {
  const candidate = fold(line.trim().replace(/^#{1,6}\s*/, '').replace(/^\d+(?:\.\d+)*[.)]?\s+/, ''));
  for (const [category, pattern] of Object.entries(CATEGORIES)) {
    const match = candidate.match(pattern);
    if (match && (candidate.length <= match[0].length + 3 || candidate.includes(':') || candidate.length < 100)) {
      return { category, headingLength: match[0].length };
    }
  }
  return null;
}

function sourceSegments(text) {
  const segments = [];
  const pattern = /[^\r\n]+/g;
  let match;
  while ((match = pattern.exec(text))) {
    const line = match[0];
    const heading = categoryForHeading(line);
    if (!heading) continue;
    // Prose that starts with “Resultados mostraram...” is not a heading.
    const colon = line.indexOf(':');
    const bare = line.trim().replace(/^#{1,6}\s*/, '').replace(/^\d+(?:\.\d+)*[.)]?\s+/, '');
    const normalized = fold(bare).replace(/[.\s:]+$/g, '');
    const headingOnly = normalized.length < 80 && (
      normalized.length === heading.headingLength ||
      /^(?:resultados? e discussao|results? and discussion|materiais e metodos|materials and methods|metodos? e procedimentos?|introducao e objetivos?)$/.test(normalized)
    );
    if (!headingOnly && (colon < 0 || colon > 90)) continue;
    segments.push({
      category: heading.category,
      label: compact(colon >= 0 ? line.slice(0, colon) : line),
      start: match.index,
      contentStart: match.index + (headingOnly ? line.length : colon + 1),
    });
  }
  return segments.map((segment, index) => ({
    ...segment,
    text: text.slice(segment.contentStart, segments[index + 1]?.start ?? text.length).trim(),
  }));
}

// Return an exact substring, preserving the source's whitespace and punctuation.
function excerpt(text, limit = 740) {
  const cleaned = text.trim();
  if (cleaned.length <= limit) return cleaned;
  const window = cleaned.slice(0, limit);
  const sentenceEnd = Math.max(window.lastIndexOf('. '), window.lastIndexOf('.\n'), window.lastIndexOf('? '), window.lastIndexOf('! '));
  const breakAt = sentenceEnd >= Math.min(100, limit / 3) ? sentenceEnd + 1 : Math.max(window.lastIndexOf(' '), window.lastIndexOf('\n'));
  return cleaned.slice(0, breakAt > 0 ? breakAt : limit).trim();
}

function sentenceWith(text, pattern) {
  const chunks = text.match(/[^.!?\n]+(?:[.!?]+|$)/g) || [text];
  return chunks.find(sentence => pattern.test(fold(sentence)))?.trim() || '';
}

const TERM_LIBRARY = [
  { term: 'Amostra', pattern: /\bamostra\w*\b|\bsample\b/, definition: 'Grupo de pessoas, registros ou observações realmente estudado. Ele é uma parte da população sobre a qual os autores querem aprender.', example: 'Se 80 universitários responderam a um questionário, essas 80 pessoas são a amostra; todos os universitários seriam uma população possível.' },
  { term: 'Correlação', pattern: /\bcorrela\w*|\bcorrelation\b/, definition: 'Medida de como duas variáveis variam juntas. Sozinha, não mostra que uma causa a outra.', example: 'Horas de sono e atenção podem estar relacionadas; rotina, saúde e outros fatores também podem influenciar as duas.' },
  { term: 'Randomização', pattern: /\brandom\w*|\baleator\w*/, definition: 'Distribuição por sorteio entre condições de um estudo. Ajuda a equilibrar diferenças prévias entre os grupos, sem garantir equilíbrio perfeito.', example: 'Sortear quem realiza uma tarefa com pausas e quem a realiza sem pausas.' },
  { term: 'Variável', pattern: /\bvariave\w*|\bvariable\w*/, definition: 'Característica que pode assumir valores diferentes e que é observada, medida ou manipulada.', example: 'Tempo de leitura, pontuação de compreensão e idade podem ser variáveis.' },
  { term: 'Hipótese', pattern: /\bhipotes\w*|\bhypothes\w*/, definition: 'Expectativa específica que a pesquisa coloca à prova. Uma hipótese pode receber apoio, não receber apoio ou continuar incerta.', example: 'Esperar uma diferença de compreensão entre duas condições é uma hipótese; ela ainda precisa de dados.' },
  { term: 'Estudo transversal', pattern: /\btransversal\b|\bcross.sectional\b/, definition: 'Estudo que observa as variáveis em um momento ou período delimitado, sem acompanhar sua mudança ao longo do tempo.', example: 'Aplicar um questionário de sono e atenção uma única vez em uma turma.' },
  { term: 'Estudo longitudinal', pattern: /\blongitudinal\b/, definition: 'Pesquisa que acompanha pessoas ou unidades em mais de um momento. Observar a ordem temporal ajuda a investigar mudanças, mas não elimina automaticamente outras explicações.', example: 'Medir o bem-estar dos mesmos estudantes no início e no fim do semestre.' },
  { term: 'Significância estatística', pattern: /\bsignificancia\b|\bestatisticamente significativ\w*|\bstatistical(?:ly)? significan\w*|\bp\s*[<=]\s*0[,.]\d+/, definition: 'Resultado de uma regra de decisão estatística, geralmente baseada em um valor de p. Não informa, sozinho, se o efeito é grande, importante na prática ou replicável.', example: 'Um valor de p abaixo do limite escolhido pode coexistir com uma diferença muito pequena na vida cotidiana.' },
  { term: 'Valor de p', pattern: /\bvalor de p\b|\bp.value\b|\bp\s*[<=]\s*0[,.]\d+/, definition: 'Sob a hipótese nula e as suposições do teste, é a probabilidade de obter dados tão ou mais incompatíveis com essa hipótese quanto os observados. Não é a probabilidade de a hipótese ser verdadeira.', example: 'p = 0,03 não significa que há 97% de chance de a explicação dos autores estar certa.' },
  { term: 'Tamanho de efeito', pattern: /\btamanho\w* (?:de |do )?efeito\b|\beffect size\b|\bd\s*=\s*0[,.]\d+/, definition: 'Número que descreve a magnitude de uma diferença ou relação. A interpretação depende da medida, do contexto e da incerteza.', example: 'Duas pesquisas podem ter resultados estatisticamente significativos e diferenças de tamanhos bastante distintos.' },
  { term: 'Intervalo de confiança', pattern: /\bintervalo\w* de confianca\b|\bconfidence interval\b|\bic\s*95/, definition: 'Faixa calculada por um procedimento que, em repetições sob as mesmas condições, teria a cobertura indicada. Ajuda a avaliar a precisão de uma estimativa.', example: 'Uma faixa ampla costuma indicar mais incerteza sobre o tamanho do efeito estimado.' },
  { term: 'Autorrelato', pattern: /\bautorrelato\w*|\bauto.relato\w*|\bself.report\w*/, definition: 'Informação que a própria pessoa fornece sobre suas experiências ou seu comportamento. É útil, mas pode sofrer influência de memória, contexto e forma da pergunta.', example: 'Responder “quanto você se distraiu?” é um autorrelato, diferente de observar cada distração diretamente.' },
  { term: 'Viés', pattern: /\bvies\w*|\bbias\w*/, definition: 'Desvio sistemático que pode influenciar como dados são selecionados, produzidos, analisados ou interpretados.', example: 'Convidar somente estudantes de uma disciplina pode produzir um grupo diferente da população que se deseja compreender.' },
  { term: 'Validade', pattern: /\bvalidade\b|\bvalidity\b/, definition: 'Grau em que evidências e teoria sustentam determinada interpretação de uma medida ou conclusão, em um contexto de uso.', example: 'Um teste pode apoiar certa interpretação para adultos e ainda precisar de evidências para uso com crianças.' },
  { term: 'Confiabilidade', pattern: /\bconfiabilidade\b|\breliability\b|\bfidedignidade\b/, definition: 'Consistência ou precisão de uma medida em condições especificadas. Uma medida consistente ainda pode não representar bem o fenômeno que interessa.', example: 'Uma escala pode produzir respostas estáveis e, mesmo assim, medir algo diferente do construto pretendido.' },
  { term: 'Pesquisa qualitativa', pattern: /\bqualitativ\w*|\bqualitative\b/, definition: 'Abordagem que investiga sentidos, experiências, processos e contextos, com procedimentos explícitos de produção e análise de dados.', example: 'Analisar entrevistas sobre como estudantes vivem a adaptação à universidade.' },
  { term: 'Pesquisa quantitativa', pattern: /\bquantitativ\w*|\bquantitative\b/, definition: 'Abordagem que usa medidas numéricas e procedimentos de análise para investigar padrões, diferenças ou relações.', example: 'Comparar pontuações de compreensão entre condições de uma tarefa.' },
  { term: 'Operacionalização', pattern: /\boperacionaliza\w*|\boperationali\w*/, definition: 'Forma concreta escolhida para observar ou medir uma ideia abstrata. A medida representa uma parte do conceito.', example: 'Definir compreensão de leitura como o número de respostas corretas em 12 questões.' },
  { term: 'Memória de trabalho', pattern: /\bmemoria de trabalho\b|\bworking memory\b/, definition: 'Conjunto de processos que mantém e manipula informações por um curto período durante uma atividade.', example: 'Manter a primeira parte de uma frase em mente enquanto você interpreta o restante.' },
  { term: 'Atenção sustentada', pattern: /\batencao sustentada\b|\bsustained attention\b/, definition: 'Capacidade de manter o envolvimento em uma atividade ao longo do tempo, que varia com tarefa, contexto e pessoa.', example: 'Acompanhar um texto por alguns minutos e perceber quando o foco se afasta.' },
];

const LOCAL_STEPS = [
  { id: 'panorama', title: 'A ideia central', question: 'Sobre o que é este artigo?', categories: ['abstract', 'context'], cue: null, priority: 'essential', guidance: ['Para estudar: escreva o tema em uma frase, com suas palavras.', 'Para estudar: separe o problema investigado da conclusão que os autores apresentam.'] },
  { id: 'pergunta', title: 'A pergunta da pesquisa', question: 'O que os autores querem descobrir?', categories: ['objective'], cue: /\bobjetiv\w*|\binvestig\w*|\baim\w*|\bwe examined\b/, priority: 'essential', guidance: ['Para estudar: identifique quem ou o que é estudado e qual pergunta é feita.', 'Para estudar: diferencie o objetivo da hipótese e do resultado.'] },
  { id: 'metodo', title: 'Como a pesquisa foi feita', question: 'Como os autores tentaram responder?', categories: ['method'], cue: /\bparticipantes\b|\bamostra\b|\bentrevist\w*|\bparticipants\b|\bsample\b/, priority: 'essential', guidance: ['Para estudar: procure participantes, seleção da amostra, medidas e procedimento.', 'Para estudar: confira se houve observação, intervenção, entrevistas ou revisão de estudos. Não suponha o desenho a partir do título.'] },
  { id: 'resultados', title: 'O que os dados mostram', question: 'Quais resultados respondem à pergunta?', categories: ['results'], cue: /\bresultados?\b|\bobservou.se\b|\bobservamos\b|\bresults?\b|\bfindings\b/, priority: 'essential', guidance: ['Para estudar: identifique a direção, o tamanho e a incerteza de cada resultado relevante.', 'Para estudar: mantenha os números e a população do texto ao explicar um achado. Associação, por si só, não demonstra causalidade.'] },
  { id: 'limites', title: 'Até onde dá para concluir', question: 'O que esta pesquisa ainda não responde?', categories: ['limits'], cue: /\blimitac\w*|\blimitaco\w*|\blimitation\w*|\bnao permite\b|\bnao podemos\b|\bcannot\b/, priority: 'essential', guidance: ['Para estudar: confira os limites da amostra, das medidas, do desenho e do tempo de acompanhamento.', 'Para estudar: uma ausência de diferença detectada não demonstra, sozinha, que dois grupos são equivalentes.'] },
  { id: 'conexoes', title: 'Conectar e revisar', question: 'Como explicar isso sem exagerar?', categories: ['discussion'], cue: null, priority: 'deepen', guidance: ['Para estudar: complete “neste estudo, com esta população, os autores observaram…”.', 'Para estudar: volte ao objetivo e explique o que foi respondido, o que continua incerto e qual pesquisa poderia avançar. Um artigo isolado não estabelece uma recomendação clínica.'] },
];

/** Create an honest, extractive reading scaffold from any supplied article. */
function analyzeArticle(text, title = 'Meu artigo científico') {
  const source = articleInput(text);
  const segments = sourceSegments(source);
  const sections = LOCAL_STEPS.map(step => {
    const found = step.categories.map(category => segments.find(segment => segment.category === category && segment.text)).find(Boolean);
    let quote = found ? excerpt(found.text) : step.cue ? excerpt(sentenceWith(source, step.cue)) : '';
    if (step.id === 'panorama' && !quote) quote = excerpt(source);
    const sourceLabel = quote ? (found ? `${found.label} · trecho original` : step.id === 'panorama' ? 'Início do texto · trecho original' : 'Trecho localizado por palavras-chave · confira o contexto') : 'Seção não identificada · orientação de estudo';
    const summary = quote
      ? `Seleção automática do texto: ${compact(quote)}${quote.length >= 700 ? ' [O trecho continua no artigo.]' : ''}`
      : 'Não foi possível identificar este ponto automaticamente no texto fornecido. Isso não prova que ele esteja ausente do artigo. Use as perguntas abaixo para procurar no original.';
    return { id: step.id, title: step.title, question: step.question, summary, keyPoints: step.guidance, quote, sourceLabel, priority: step.priority };
  });
  const byId = id => sections.find(section => section.id === id);
  const sourceFolded = fold(source);
  const glossary = TERM_LIBRARY.filter(entry => entry.pattern.test(sourceFolded)).slice(0, 12).map(({ term, definition, example }) => ({ term, definition, example }));
  const titleText = typeof title === 'string' && title.trim() ? compact(title).slice(0, 250) : 'Meu artigo científico';
  const limitations = [
    'Este é um roteiro local: ele seleciona trechos e oferece perguntas gerais de leitura. Não produz uma interpretação científica completa nem traduz automaticamente o artigo.',
    'Os trechos são literais, mas a seleção automática pode perder contexto, tabelas, números ou seções. Confira sempre o documento original.',
    'As definições do glossário e as perguntas de estudo são explicações gerais; não são resultados atribuídos ao artigo.',
  ];
  if (source.length < 1800) limitations.push('O texto fornecido é curto. Ele pode ser apenas parte do artigo; conclusões, métodos ou limitações podem estar fora deste recorte.');
  if (!segments.length) limitations.push('Não foram reconhecidos títulos de seções. O roteiro usa o início do texto e palavras-chave; confirme a localização dos trechos.');
  const flashcards = [
    { question: 'Qual é a pergunta deste artigo?', answer: byId('pergunta').quote ? `Confira este trecho e reformule com suas palavras: “${byId('pergunta').quote}”` : 'O roteiro não identificou o objetivo. Procure-o no resumo ou no fim da introdução e escreva a pergunta em uma frase.' },
    { question: 'Quais quatro elementos devo procurar no método?', answer: 'Quem ou o que foi estudado; como a amostra foi escolhida; o que foi medido; como o procedimento ocorreu. Registre somente o que o artigo informa.' },
    { question: 'Que evidência sustenta a conclusão principal?', answer: byId('resultados').quote ? `Comece pelo resultado selecionado, sem perder seu contexto: “${byId('resultados').quote}”` : 'Procure o resultado que responde diretamente ao objetivo. O roteiro não identificou esse trecho automaticamente.' },
    { question: 'O que preciso conferir antes de generalizar um resultado?', answer: 'A população, a seleção da amostra, o desenho, as medidas e a incerteza. Um resultado encontrado em uma condição específica não se aplica automaticamente a todas as pessoas.' },
  ];
  const quiz = [
    { question: 'Qual atitude ajuda a ler este artigo com mais precisão?', options: ['Aceitar a conclusão sem olhar os dados.', 'Conferir se o resultado responde ao objetivo e respeita o método.', 'Memorizar todos os números antes de entender a pergunta.'], correct: 1, explanation: 'A conclusão precisa se apoiar nos resultados e no desenho do estudo. Compreender essa ligação vem antes de decorar detalhes.' },
    { question: 'Se duas variáveis estão associadas, o que posso concluir apenas com essa informação?', options: ['Uma necessariamente causa a outra.', 'A relação vale para todas as pessoas.', 'Elas variam juntas; a causa exige outras evidências.'], correct: 2, explanation: 'Uma associação pode refletir diferentes direções de influência ou outros fatores. O desenho e as demais evidências determinam a interpretação.' },
    { question: 'Se este roteiro não identificou uma limitação, isso significa que o estudo não tem limites?', options: ['Não. É preciso procurar no texto e avaliar o método.', 'Sim. A seleção automática garante que não há limitações.', 'Sim, desde que o artigo tenha um resumo.'], correct: 0, explanation: 'Uma falha de identificação automática não é uma conclusão científica. Todo estudo deve ser interpretado no contexto de suas condições e incertezas.' },
  ];
  return validateGuide({
    title: titleText,
    overview: 'Seu artigo virou um roteiro de leitura em seis passos. Primeiro, entenda a pergunta; depois, conecte método, resultados e limites. Os resumos abaixo são trechos selecionados automaticamente. As perguntas são orientações gerais para você construir sua própria explicação.',
    sections, glossary, flashcards, quiz, limitations, mode: 'local',
  }, source);
}

function invalid(path, message) { throw new Error(`Guia inválido em ${path}: ${message}`); }
function record(value, path) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) invalid(path, 'esperado um objeto.');
  const prototype = Object.getPrototypeOf(value);
  if (prototype !== Object.prototype && prototype !== null) invalid(path, 'tipo de objeto não permitido.');
  return value;
}
function string(value, path, max, allowEmpty = false) {
  if (typeof value !== 'string') invalid(path, 'esperado um texto.');
  const clean = value.trim();
  if (!allowEmpty && !clean) invalid(path, 'o texto não pode estar vazio.');
  if (clean.length > max) invalid(path, `o limite é ${max} caracteres.`);
  if (/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/.test(clean)) invalid(path, 'o texto contém caracteres de controle.');
  return clean;
}
function array(value, path, min, max, convert) {
  if (!Array.isArray(value) || value.length < min || value.length > max) invalid(path, `esperada uma lista com ${min} a ${max} itens.`);
  return value.map((item, index) => convert(item, `${path}[${index}]`));

/**
 * Strictly validate and copy imported data into the supported plain-text shape.
 * Throws a Portuguese Error on malformed data. If sourceText is supplied, every
 * nonempty quotation must be a literal substring. This verifies quotes, not the
 * scientific accuracy of the surrounding interpretation.
 */
function validateGuide(value, sourceText) {
  const guide = record(value, 'guia');
  if (sourceText !== undefined && typeof sourceText !== 'string') invalid('fonte', 'esperado o texto original.');
  const title = string(guide.title, 'title', 250);
  const overview = string(guide.overview, 'overview', 6000);
  if (!['local', 'ai', 'demo'].includes(guide.mode)) invalid('mode', 'use local, ai ou demo.');
  const sections = array(guide.sections, 'sections', 3, 12, (input, path) => {
    const section = record(input, path);
    const id = string(section.id, `${path}.id`, 60);
    if (!/^[a-zA-Z0-9][a-zA-Z0-9_-]*$/.test(id)) invalid(`${path}.id`, 'use apenas letras sem acento, números, hífen ou sublinhado.');
    if (!['essential', 'deepen'].includes(section.priority)) invalid(`${path}.priority`, 'use essential ou deepen.');
    const quote = string(section.quote, `${path}.quote`, 5000, true);
    const sourceLabel = string(section.sourceLabel, `${path}.sourceLabel`, 200);
    if (!quote && !/orienta|nao (?:identificad|confirmad|localizad|disponivel)|sem (?:trecho|citacao)|nao consta|nao informad/.test(fold(sourceLabel))) invalid(`${path}.sourceLabel`, 'indique orientação ou trecho não identificado quando a citação estiver vazia.');
    if (quote && sourceText !== undefined && !sourceText.includes(quote)) invalid(`${path}.quote`, 'a citação não foi encontrada literalmente no artigo.');
    return {
      id, title: string(section.title, `${path}.title`, 160), question: string(section.question, `${path}.question`, 500),
      summary: string(section.summary, `${path}.summary`, 6000),
      keyPoints: array(section.keyPoints, `${path}.keyPoints`, 1, 10, (point, pointPath) => string(point, pointPath, 1500)),
      quote, sourceLabel, priority: section.priority,
    };
  });
  if (unique(sections.map(section => section.id)).length !== sections.length) invalid('sections', 'cada seção precisa de um id diferente.');
  const glossary = array(guide.glossary, 'glossary', 0, 40, (input, path) => {
    const entry = record(input, path);
    return { term: string(entry.term, `${path}.term`, 140), definition: string(entry.definition, `${path}.definition`, 2000), example: string(entry.example, `${path}.example`, 1800) };
  });
  const flashcards = array(guide.flashcards, 'flashcards', 0, 40, (input, path) => {
    const entry = record(input, path);
    return { question: string(entry.question, `${path}.question`, 700), answer: string(entry.answer, `${path}.answer`, 6000) };
  });
  const quiz = array(guide.quiz, 'quiz', 0, 30, (input, path) => {
    const entry = record(input, path);
    const options = array(entry.options, `${path}.options`, 2, 5, (option, optionPath) => string(option, optionPath, 1600));
    if (unique(options.map(option => fold(compact(option)))).length !== options.length) invalid(`${path}.options`, 'as alternativas precisam ser diferentes.');
    if (!Number.isInteger(entry.correct) || entry.correct < 0 || entry.correct >= options.length) invalid(`${path}.correct`, 'o índice da resposta deve começar em zero e apontar para uma alternativa.');
    return { question: string(entry.question, `${path}.question`, 1000), options, correct: entry.correct, explanation: string(entry.explanation, `${path}.explanation`, 3000) };
  });
  const limitations = array(guide.limitations, 'limitations', 1, 20, (item, path) => string(item, path, 1800));
  const normalized = { title, overview, sections, glossary, flashcards, quiz, limitations, mode: guide.mode };
  if (JSON.stringify(normalized).length > 180000) invalid('guia', 'o guia ultrapassa o tamanho máximo de 180 mil caracteres.');
  return normalized;
}

const DEMO_TITLE = 'Pausas breves e compreensão de textos em universitários';

// Original teaching material, deliberately not presented as a published paper.
const DEMO_TEXT = `Pausas breves e compreensão de textos em universitários
MATERIAL FICTÍCIO PARA DEMONSTRAÇÃO — Este texto foi criado exclusivamente para ensinar leitura científica. Não corresponde a uma pesquisa real, não tem autores, periódico ou DOI e não deve ser citado como evidência.

Resumo
Este estudo fictício investigou se duas pausas breves durante uma tarefa de leitura estavam associadas a diferenças na compreensão imediata de um texto. Noventa e seis estudantes universitários foram distribuídos aleatoriamente entre uma condição de leitura com pausas e uma condição de leitura contínua. A compreensão foi avaliada por 12 questões sobre o texto. A média foi de 8,1 acertos na condição com pausas e 7,0 na condição contínua, com diferença estimada de 1,1 acerto, p = 0,03 e tamanho de efeito d = 0,44. Os dados ilustrativos se referem a uma única tarefa e não permitem concluir sobre aprendizagem duradoura ou tratamento de TDAH.

Introdução
A leitura acadêmica exige selecionar informações, relacionar ideias e monitorar a própria compreensão. A atenção sustentada pode variar com a dificuldade do texto, o contexto e o tempo de atividade. Pausas curtas são uma estratégia possível de organização da tarefa, mas sua utilidade precisa ser avaliada em condições específicas. Uma pontuação em compreensão não representa, sozinha, toda a capacidade de atenção de uma pessoa.

Objetivo
O objetivo deste exercício fictício foi comparar a compreensão imediata de um texto entre universitários que realizaram duas pausas de um minuto e universitários que leram de forma contínua. A hipótese ilustrativa era de que a condição com pausas teria uma média maior de acertos.

Método
Participaram 96 estudantes de graduação de uma única universidade, recrutados por conveniência. A amostra não foi selecionada para representar todas as pessoas universitárias. Não houve avaliação diagnóstica de TDAH nem formação de um grupo clínico.
Uma distribuição aleatória alocou 48 participantes em cada condição. Todos leram o mesmo texto de divulgação científica, em ambiente silencioso, com 24 minutos totais de leitura. Na condição com pausas, a leitura ocorreu em três blocos de oito minutos, separados por duas pausas de um minuto, sem uso de celular. Na condição contínua, a leitura ocorreu em um único bloco de 24 minutos. Assim, o tempo total decorrido foi de 26 minutos na condição com pausas e 24 minutos na condição contínua.
Imediatamente após a tarefa, os participantes responderam a 12 questões de compreensão. A pontuação variava de zero a 12 acertos e foi a medida principal. Também informaram a distração percebida em uma escala de um a cinco; esse autorrelato foi uma medida secundária. O exercício comparou as médias de compreensão e apresentou um tamanho de efeito padronizado. Não foi realizado acompanhamento posterior.

Resultados
A média de compreensão foi de 8,1 acertos entre os participantes da condição com pausas e de 7,0 acertos entre os participantes da condição contínua. A diferença estimada foi de 1,1 acerto, com p = 0,03 e tamanho de efeito padronizado d = 0,44. Estes números são inteiramente fictícios e servem apenas para exercitar a interpretação.
A distração percebida teve médias descritivas de 3,0 na condição com pausas e 3,5 na condição contínua. Não foi apresentado teste inferencial para essa medida secundária. Portanto, a diferença descritiva não deve ser tratada como evidência de um efeito estatisticamente demonstrado na distração. Não foram fornecidos intervalos de confiança neste exercício.

Discussão
Neste exemplo, a condição com pausas apresentou maior média de compreensão imediata. A distribuição aleatória fortalece a comparação entre as condições dentro do experimento, mas não transforma os participantes em uma amostra representativa. Além disso, as condições diferiram no tempo total decorrido e na organização temporal da leitura; o desenho não permite separar completamente esses componentes.
Um valor de p de 0,03 não significa 97% de probabilidade de a hipótese estar correta. O tamanho de efeito de 0,44 descreve uma diferença padronizada e precisa de contexto e de uma estimativa de incerteza para ser interpretado. O resultado é sobre uma tarefa específica, e não sobre a eficácia de uma estratégia para qualquer pessoa.

Limitações
As principais limitações deste exercício são a amostra por conveniência de uma única universidade, a realização de uma única tarefa, a ausência de acompanhamento e a diferença de dois minutos no tempo total decorrido entre as condições. O autorrelato de distração pode sofrer influência da memória e das expectativas dos participantes. A ausência de intervalos de confiança limita a avaliação da precisão das estimativas. Como não houve avaliação diagnóstica, não é possível tirar conclusões específicas sobre pessoas com TDAH.

Conclusão
O exemplo mostra uma diferença de compreensão imediata favorável à condição com pausas nas condições descritas. Pesquisas reais precisariam replicar o achado, igualar o tempo total entre condições, incluir diferentes populações e avaliar retenção em outros momentos. Este material não fundamenta recomendações clínicas e não representa evidência científica real.`;

function lessonHtml(a){const s=a.guide.sections[step];return `<div class="study-layout"><aside class="study-nav" aria-label="Etapas do artigo"><div class="eyebrow">SEU PERCURSO · ${a.guide.sections.length} ETAPAS</div>${a.guide.sections.map((s,i)=>`<button data-step="${i}" class="${i===step?'active':''}" ${i===step?'aria-current="step"':''}><span class="step-count">${a.completed.includes(s.id)?'✓':String(i+1).padStart(2,'0')}</span><span>${esc(s.title)}</span></button>`).join('')}<div class="notice">Comece pelo essencial.<br>Volte aos detalhes quando fizer sentido para você.</div></aside><div class="study-main"><article class="lesson"><div class="card-tags"><span class="pill ${s.priority==='deepen'?'purple':''}">${s.priority==='deepen'?'PARA APROFUNDAR':'ESSENCIAL PARA ENTENDER'}</span><span class="tiny">Etapa ${step+1} de ${a.guide.sections.length}</span></div><h2>${esc(s.question||s.title)}</h2><div class="lead">${esc(s.summary)}</div><h3>${a.guide.mode==='local'?'Perguntas para orientar sua leitura':'Leve estas ideias com você'}</h3><ul class="key-points">${s.keyPoints.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${s.quote?`<details class="source"><summary>${icon('file')}Conferir trecho do artigo · ${esc(s.sourceLabel)}</summary><blockquote>${esc(s.quote)}</blockquote><button class="text-button" data-action="original">Ler o texto completo ${icon('arrow')}</button></details>`:''}<label class="understood"><input type="checkbox" id="understood" ${a.completed.includes(s.id)?'checked':''}>Estudei esta etapa e consigo explicar a ideia principal</label></article><div class="lesson-controls"><button class="button" data-action="previous" ${step===0?'disabled':''}>${icon('left')}Etapa anterior</button><button class="button primary" data-action="next">${step===a.guide.sections.length-1?'Revisar o que aprendi':'Próxima etapa'}${icon('arrow')}</button></div></div></div>`;}
function glossaryHtml(a){return `<div class="section-heading" style="margin-top:25px"><div><h2>Um nome difícil. Uma ideia possível.</h2><p class="muted" style="font-size:12px;margin-top:9px">Definições gerais para apoiar sua leitura. Confira como o artigo usa cada termo.</p></div></div><div class="glossary-grid">${a.guide.glossary.map(g=>`<article class="term-card"><span class="pill">CONCEITO</span><h3 style="margin-top:13px">${esc(g.term)}</h3><p>${esc(g.definition)}</p><div class="example"><strong>Na prática:</strong> ${esc(g.example)}</div></article>`).join('')||'<div class="empty-state">Nenhum termo identificado. Use a IA para criar um glossário deste artigo.</div>'}</div>`;}
function cardsHtml(a){const cards=a.guide.flashcards;cardIndex=Math.min(cardIndex,cards.length-1);if(!cards.length)return '<div class="empty-state">Use a IA para criar cartões deste artigo.</div>';const c=cards[cardIndex];return `<div style="margin:25px 0 18px"><div class="section-heading"><h2>O que ficou com você?</h2><span class="tiny">Cartão ${cardIndex+1} de ${cards.length}</span></div><p class="muted" style="font-size:12px">Tente lembrar antes de revelar. Consultar o texto também faz parte.</p></div><div class="flashcard"><span class="eyebrow" style="margin-bottom:24px">${flipped?'RESPOSTA PARA CONFERIR':'TENTE RESPONDER COM SUAS PALAVRAS'}</span>${flipped?`<p>${esc(c.answer)}</p>`:`<h2>${esc(c.question)}</h2>`}<button class="button soft" data-action="flip">${icon(flipped?'reset':'spark')}${flipped?'Ver pergunta':'Revelar resposta'}</button></div><div class="lesson-controls" style="max-width:800px">${flipped?`<button class="button" data-action="card-again">${icon('review')}Quero rever</button><button class="button primary" data-action="card-known">${icon('check')}Consegui lembrar</button>`:`<button class="button" data-action="card-prev" ${cardIndex===0?'disabled':''}>${icon('left')}Anterior</button><button class="button" data-action="card-next">Próximo ${icon('arrow')}</button>`}</div><p class="privacy-note">${Object.values(a.review.cards||{}).filter(v=>v==='known').length} de ${cards.length} cartões marcados como lembrados · Autoavaliação, sem pressão.</p>`;}
function quizHtml(a){const qs=a.guide.quiz;if(!qs.length)return '<div class="empty-state">Use a IA para criar perguntas específicas deste artigo.</div>';quizIndex=Math.min(quizIndex,qs.length-1);const q=qs[quizIndex];return `<div style="margin-top:27px;max-width:800px"><div class="section-heading"><h2>Uma pausa para lembrar.</h2><span class="tiny">Pergunta ${quizIndex+1} de ${qs.length}</span></div><article class="lesson"><span class="eyebrow">${a.guide.mode==='local'?'LEITURA CIENTÍFICA · CONCEITOS GERAIS':'TESTE RÁPIDO · SEM NOTA'}</span><h2 style="font-size:25px">${esc(q.question)}</h2>${q.options.map((o,i)=>`<button class="quiz-option ${quizAnswer!==null?(i===q.correct?'correct':i===quizAnswer?'wrong':''):''}" data-quiz-answer="${i}" ${quizAnswer!==null?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)} ${quizAnswer!==null&&i===q.correct?'✓':''}</button>`).join('')}${quizAnswer!==null?`<div class="quiz-feedback ${quizAnswer===q.correct?'':'wrong'}"><strong>${quizAnswer===q.correct?'Isso mesmo.':'Vamos olhar de novo.'}</strong><br>${esc(q.explanation)}</div>`:''}</article><div class="lesson-controls"><button class="button" data-action="quiz-restart">${icon('reset')}Recomeçar</button>${quizAnswer!==null?`<button class="button primary" data-action="quiz-next">${quizIndex===qs.length-1?'Finalizar revisão':'Próxima pergunta'}${icon('arrow')}</button>`:''}</div></div>`;}

function helpPage(){shell(`<div class="greeting">${icon('leaf')}APRENDER PODE SER MAIS LEVE</div><div class="page-intro"><div><h1>O artigo é complexo.<br><em>O caminho pode ser simples.</em></h1><p>Um espaço de estudo pensado para reduzir a sobrecarga, com etapas curtas e escolhas claras.</p></div></div><div class="help-grid">${[['01','Comece pelo seu artigo','Importe um PDF com texto selecionável, TXT ou Markdown. Se tiver um PDF escaneado, use OCR em outro aplicativo e cole o texto aqui.'],['02','Entenda antes de decorar','O modo local organiza trechos e perguntas de leitura. A IA pode criar uma explicação didática, exemplos, conceitos e revisão a partir do seu artigo.'],['03','Escolha uma etapa por vez','Use o modo foco, aumente o texto ou ouça a explicação. O temporizador é opcional: uma pausa não apaga seu progresso.'],['04','Teste o que ficou','Explique com suas palavras, revele os flashcards e faça o teste rápido. Volte ao trecho original para conferir números e conclusões.']].map(([n,t,p])=>`<article class="help-card"><span class="pill">${n}</span><h2>${t}</h2><p>${p}</p></article>`).join('')}</div><article class="help-card"><h2>Essencial agora. Detalhes depois.</h2><p>Priorize a pergunta do estudo, quem participou, o que foi feito, o resultado e os limites da conclusão. Técnicas estatísticas e debates específicos podem entrar em uma segunda passagem, conforme a disciplina e a orientação do professor. Nenhuma parte é descartável para sempre.</p></article><div class="notice">O Lume é uma ferramenta de estudo, sem garantia de benefício clínico para TDAH. Explicações de IA podem conter erros. Um artigo isolado não estabelece consenso científico nem orienta uma decisão clínica por si só.</div><div class="help-grid"><article class="help-card"><h2>Seu espaço é seu.</h2><p>Artigos, anotações e progresso ficam no armazenamento deste navegador. Não há sincronização automática. Exporte uma cópia antes de limpar os dados ou trocar de dispositivo. Ao usar IA, você escolhe enviar o texto ao serviço utilizado.</p><button class="text-button" data-action="backup" style="margin-top:13px">${icon('download')}Exportar biblioteca</button></article><article class="help-card"><h2>Leve o Lume com você.</h2><p>O código inclui um servidor local e integração opcional com a API da OpenAI. Também é possível usar sua conversa no ChatGPT para criar um guia e importá-lo aqui.</p><button class="text-button" data-action="settings" style="margin-top:13px">${icon('settings')}Preferências e cópias</button></article></div>`)}

function pasteModal(){modal('Uma leitura começa aqui.',`<p class="dialog-description">Cole o artigo completo ou um trecho. O guia só pode trabalhar com o texto que você fornecer.</p><form id="paste-form"><label class="form-field">Título do artigo<input id="article-title" required maxlength="500" placeholder="Como se chama esta leitura?"></label><label class="form-field">Texto do artigo<textarea id="article-text" required minlength="100" maxlength="150000" placeholder="Cole o resumo, o artigo completo ou uma seção…"></textarea></label><p class="tiny">De 100 a 150.000 caracteres. O modo local organiza o texto sem enviá-lo a um serviço externo.</p><div class="dialog-actions"><button class="button primary" type="submit">Criar meu percurso ${icon('arrow')}</button></div></form>`);dc.querySelector('#paste-form').onsubmit=e=>{e.preventDefault();addArticle(dc.querySelector('#article-text').value,dc.querySelector('#article-title').value)}}
function addArticle(text,title){if(text.trim().length<100){toast('Precisamos de pelo menos 100 caracteres para organizar a leitura.');return}if(text.length>150000){toast('Este texto é grande. Importe uma seção de até 150.000 caracteres.');return}if(data.articles.length>=20){toast('Sua biblioteca tem 20 artigos. Exporte e remova um para adicionar outro.');return}const a={id:crypto.randomUUID(),title:title.trim().slice(0,500)||'Meu artigo',text,guide:analyzeArticle(text,title),completed:[],notes:'',review:{},created:Date.now()};data.articles.unshift(a);persist();dialog.close();openStudy(a.id);toast('Artigo importado. Vamos começar pela primeira ideia.')}
async function readFile(file){if(!file)return;if(file.size>20*1024*1024){toast('Escolha um arquivo de até 20 MB.');return}const name=file.name.toLowerCase();try{if(name.endsWith('.json')){importBackup(JSON.parse(await file.text()));return}if(name.endsWith('.pdf')){modal('Preparando sua leitura…','<div class="loading-message"><span class="spinner"></span><span id="pdf-progress">Lendo o PDF no seu navegador…</span></div><p class="tiny">O arquivo não está sendo enviado. PDFs escaneados precisam de OCR.</p>');let pdfjs,pdfWorker;try{pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');pdfWorker='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs'}catch{pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs');pdfWorker='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs'}pdfjs.GlobalWorkerOptions.workerSrc=pdfWorker;const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,useSystemFonts:true}).promise;try{if(pdf.numPages>100)throw Error('Este PDF tem mais de 100 páginas. Separe o artigo ou importe uma seção.');let text='';for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();text+=`\n\n[ Página ${i} ]\n`+c.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('');if(text.length>150000)throw Error('O texto ultrapassou 150.000 caracteres. Divida o PDF em seções.');const label=dc.querySelector('#pdf-progress');if(label)label.textContent=`Organizando a página ${i} de ${pdf.numPages}…`;p.cleanup()}if(text.replace(/\[ Página \d+ \]/g,'').trim().length<100)throw Error('Não encontramos texto suficiente. Este PDF pode ser escaneado; use OCR e cole o texto.');addArticle(text,file.name.replace(/\.pdf$/i,''))}finally{pdf.destroy()}return}if(!/\.(txt|md)$/i.test(file.name))throw Error('Escolha um arquivo PDF, TXT, Markdown ou uma cópia JSON do Lume.');addArticle(await file.text(),file.name.replace(/\.(txt|md)$/i,''))}catch(e){modal('Vamos tentar de outro jeito.',`<p class="dialog-description">${esc(e.message.includes('Failed to fetch dynamically')?'O leitor de PDF não carregou. Use a versão local completa ou cole o texto do artigo.':e.message)}</p><button class="button primary" data-action="paste">${icon('note')}Colar o texto</button>`)}}
function normalizeArticle(raw){if(!raw||typeof raw.title!=='string'||typeof raw.text!=='string'||raw.text.length>150000||typeof raw.notes!=='string'||raw.notes.length>50000)throw Error('Esta cópia de artigo não é válida.');const guide=validateGuide(raw.guide,raw.text);return {...raw,id:crypto.randomUUID(),guide,completed:Array.isArray(raw.completed)?raw.completed.filter(x=>typeof x==='string'&&guide.sections.some(s=>s.id===x)):[],review:raw.review&&typeof raw.review==='object'?raw.review:{},synthetic:guide.mode==='demo',created:Date.now()}}
function importBackup(value){if(value?.version!==1)throw Error('Versão da cópia não reconhecida.');let items;if(value.format==='lume-library'&&Array.isArray(value.articles))items=value.articles;else if(value.format==='lume-article')items=[value.article];else throw Error('Use uma cópia exportada pelo Lume. Para importar um guia de IA, abra o artigo e escolha “Explicar com IA”.');if(items.length+data.articles.length>20)throw Error('A biblioteca comporta 20 artigos. Exporte e remova alguns antes de restaurar.');const validated=items.map(normalizeArticle);modal('Restaurar sua cópia?',`<p class="dialog-description">${validated.length} artigo(s) serão adicionados à biblioteca, com suas anotações e progresso. Seus estudos atuais serão preservados.</p>`,`<button id="confirm-restore" class="button primary">Adicionar à biblioteca</button>`);dc.querySelector('#confirm-restore').onclick=()=>{data.articles.unshift(...validated);persist();dialog.close();navigate('library');toast('Cópia restaurada. Seus estudos estão aqui.')}}
function settingsModal(){modal('Do seu jeito.',`<p class="dialog-description">Escolha o que deixa seu momento de estudo mais confortável.</p><label class="check-row"><input id="large-text" type="checkbox" ${data.settings.large?'checked':''}>Texto maior durante o estudo</label><label class="form-field">Duração da sessão de foco<select id="session-minutes">${[5,10,15,25].map(n=>`<option value="${n}" ${data.settings.minutes===n?'selected':''}>${n} minutos</option>`).join('')}</select></label><p class="tiny">Você pode pausar ou reiniciar. Nenhuma meta obrigatória.</p><div class="divider"></div><div class="stat-row"><strong>Explicação automática com IA</strong><span class="status-tag">${aiAvailable?'Disponível':'Não configurada'}</span></div><p class="dialog-description">${aiAvailable?'A API está configurada no servidor. O texto só é enviado ao escolher gerar uma explicação.':'A leitura local já funciona. Você também pode copiar um pedido para o ChatGPT e importar a resposta. O código inclui integração opcional com a API da OpenAI.'}</p><div class="divider"></div><div class="stat-row"><strong>Sua biblioteca</strong><span class="tiny">${data.articles.length} artigo(s)</span></div><button class="button small" data-action="backup">${icon('download')}Exportar cópia</button> <button class="button small" data-action="restore">${icon('upload')}Restaurar cópia</button><p class="privacy-note">Os dados ficam neste navegador e podem ser apagados ao limpar os dados do site. Guarde uma cópia regularmente.</p><div class="dialog-actions"><button id="save-settings" class="button primary">Salvar preferências ${icon('check')}</button></div>`);dc.querySelector('#save-settings').onclick=()=>{data.settings.large=dc.querySelector('#large-text').checked;const n=Number(dc.querySelector('#session-minutes').value);if(n!==data.settings.minutes){data.settings.minutes=n;resetTimer()}persist();dialog.close();render();toast('Seu espaço, do seu jeito.')}}
function articleMenu(id){const a=data.articles.find(x=>x.id===id);modal('Seu artigo.',`<p class="dialog-description">${esc(a.title)}</p><div style="display:grid;gap:10px"><button class="button" id="menu-export">${icon('download')}Exportar artigo, guia e anotações</button><button class="button danger" id="menu-delete">${icon('trash')}Remover da biblioteca</button></div>`);dc.querySelector('#menu-export').onclick=()=>exportArticle(a);dc.querySelector('#menu-delete').onclick=()=>{modal('Remover este artigo?',`<p class="dialog-description">O artigo e suas anotações serão removidos deste navegador. Exporte uma cópia se quiser guardar seu estudo.</p>`,`<button class="button" id="cancel-delete">Cancelar</button><button class="button danger" id="confirm-delete">Remover artigo</button>`);dc.querySelector('#cancel-delete').onclick=()=>dialog.close();dc.querySelector('#confirm-delete').onclick=()=>{data.articles=data.articles.filter(x=>x.id!==id);persist();dialog.close();render();toast('Artigo removido.')}}}
function aiModal(){const a=article();modal('Vamos dar clareza ao artigo.',`<p class="dialog-description">Crie uma explicação em português, pensada para quem está começando a estudar Psicologia. As conclusões devem permanecer ligadas ao texto original.</p>${aiAvailable?`<div class="ai-box"><h3>Gerar dentro do Lume</h3><p>O texto deste artigo será enviado à API da OpenAI configurada no servidor. A API pode gerar custos na conta responsável.</p><button class="button primary" id="generate-ai">${icon('spark')}Gerar explicação didática</button></div>`:`<div class="notice">A explicação automática por API ainda não está configurada. Você pode usar sua conversa no ChatGPT pelo caminho abaixo.</div>`}<div class="ai-box"><h3>Usar com o ChatGPT</h3><p>1. Copie o pedido preparado com o seu artigo.<br>2. Cole no ChatGPT e peça a resposta em JSON.<br>3. Volte aqui e importe o JSON para montar seu percurso.</p><button class="button soft" id="copy-prompt">${icon('copy')}Copiar pedido + artigo</button><a class="button" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Abrir ChatGPT ${icon('external')}</a><label class="form-field">Cole a resposta JSON do ChatGPT<textarea id="ai-json" placeholder='{"title": "…", "overview": "…", ...}' maxlength="200000" style="min-height:110px"></textarea></label><button class="button primary" id="import-ai">${icon('upload')}Aplicar guia ao artigo</button><p id="ai-error" class="error-message" role="alert"></p></div><p class="privacy-note">O guia substituirá o percurso atual e reiniciará suas marcações de estudo e revisão. Suas anotações e o original serão preservados.</p>`);
dc.querySelector('#copy-prompt').onclick=()=>copyText(buildChatGPTPrompt(a.text,a.title));dc.querySelector('#import-ai').onclick=()=>{try{let raw=dc.querySelector('#ai-json').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');applyGuide(a,validateGuide({...JSON.parse(raw),mode:'ai'},a.text))}catch(e){dc.querySelector('#ai-error').textContent='Não conseguimos aplicar o guia: '+e.message}};const gen=dc.querySelector('#generate-ai');if(gen)gen.onclick=async()=>{gen.disabled=true;gen.textContent='Preparando sua explicação…';try{const r=await fetch('/api/study',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:a.text,title:a.title})});const result=await r.json();if(!r.ok)throw Error(result.error||'Não foi possível gerar o guia agora.');applyGuide(a,validateGuide(result.guide,a.text))}catch(e){gen.disabled=false;gen.textContent='Tentar novamente';dc.querySelector('#ai-error').textContent=e.message}};}
function applyGuide(a,guide){a.guide=guide;a.completed=[];a.review={};step=0;cardIndex=0;quizIndex=0;quizAnswer=null;studyTab='guide';persist();dialog.close();study();toast('Seu guia está pronto. Vamos por partes.')}
async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Pedido copiado. Cole na sua conversa no ChatGPT.')}catch{modal('Seu pedido para o ChatGPT.',`<p class="dialog-description">Selecione e copie o texto abaixo. Ele já inclui seu artigo e as instruções do guia.</p><textarea id="copy-fallback" class="note-editor" readonly>${esc(text)}</textarea>`);dc.querySelector('#copy-fallback').select()}}
function saveFile(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const slug=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').slice(0,70).toLowerCase();
function exportArticle(a){saveFile('lume-'+slug(a.title)+'.json',JSON.stringify({format:'lume-article',version:1,article:a},null,2));toast('Cópia do estudo preparada para download.')}
function markdown(a){return `# ${a.title}\n\n${a.synthetic?'Exemplo fictício para estudo.\n\n':''}${a.guide.overview}\n\n${a.guide.sections.map(s=>`## ${s.title}\n\n${s.summary}\n\n${s.keyPoints.map(p=>'- '+p).join('\n')}\n\n${s.quote?'> '+s.quote.replace(/\n/g,'\n> '):''}`).join('\n\n')}\n\n## Conceitos\n\n${a.guide.glossary.map(g=>`- **${g.term}:** ${g.definition} Exemplo: ${g.example}`).join('\n')}\n\n## Minhas anotações\n\n${a.notes||'(Ainda sem anotações.)'}\n\n## Limitações e cuidados\n\n${a.guide.limitations.map(p=>'- '+p).join('\n')}\n\nExportado do Lume. Modo: ${a.guide.mode}. Confira as explicações com o artigo original.\n`;}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function updateTimer(){if(timerRunning){timerLeft=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));if(timerLeft===0){timerRunning=false;clearInterval(timerInterval);toast('Sua sessão terminou. Faça uma pausa e volte quando quiser.')}}document.querySelectorAll('[data-timer]').forEach(x=>x.textContent=formatTime(timerLeft));document.querySelectorAll('[data-timer-label]').forEach(x=>x.textContent=timerRunning?'Pausar':'Começar')}
function toggleTimer(){if(timerRunning){timerLeft=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));timerRunning=false;clearInterval(timerInterval)}else{if(timerLeft<=0)timerLeft=data.settings.minutes*60;timerRunning=true;timerDeadline=Date.now()+timerLeft*1000;timerInterval=setInterval(updateTimer,500)}updateTimer()}
function resetTimer(){timerRunning=false;clearInterval(timerInterval);timerLeft=data.settings.minutes*60;updateTimer()}
function stopSpeech(){if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function speak(){if(!('speechSynthesis'in window)){toast('Este navegador não oferece leitura em voz alta.');return}if(window.speechSynthesis.speaking){stopSpeech();toast('Leitura pausada.');return}const a=article();let text=studyTab==='guide'?[a.guide.sections[step].question,a.guide.sections[step].summary,...a.guide.sections[step].keyPoints].join('. '):studyTab==='glossary'?a.guide.glossary.map(g=>g.term+'. '+g.definition+'. '+g.example).join('. '):studyTab==='cards'?(flipped?a.guide.flashcards[cardIndex]?.answer:a.guide.flashcards[cardIndex]?.question):studyTab==='notes'?a.notes:studyTab==='quiz'?a.guide.quiz[quizIndex]?.question:a.text;if(!text){toast('Ainda não há texto para ouvir.');return}const utter=new SpeechSynthesisUtterance(text);utter.lang='pt-BR';utter.rate=.93;const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()==='pt-br');if(voice)utter.voice=voice;speechSynthesis.speak(utter);toast('Lendo em voz alta. Clique em ouvir novamente para parar.')}
function action(act,b){const a=article();switch(act){case'upload':pickFile();break;case'paste':pasteModal();break;case'demo':if(!data.articles.some(a=>a.id==='demo')){data.articles.push(demo());persist()}dialog.close();openStudy('demo');break;case'settings':settingsModal();break;case'library':navigate('library');break;case'backup':saveFile('lume-biblioteca.json',JSON.stringify({format:'lume-library',version:1,articles:data.articles,settings:data.settings},null,2));toast('Cópia da biblioteca preparada para download.');break;case'restore':document.querySelector('#backup-file').click();break;case'about':dialog.close();navigate('help');break;case'timer':toggleTimer();break;case'timer-reset':resetTimer();break;case'next':if(step<a.guide.sections.length-1)setStep(step+1);else{studyTab='cards';flipped=false;cardIndex=0;study()}break;case'previous':if(step>0)setStep(step-1);break;case'focus':focus=!focus;if(focus){studyTab='guide';study();toast('Só você e uma ideia. Use o botão no topo para sair.')}else study();break;case'speak':speak();break;case'original':studyTab='original';study();break;case'export-article':modal('Leve seu estudo com você.',`<p class="dialog-description">A cópia JSON permite restaurar tudo no Lume. O Markdown é um documento de texto para ler e compartilhar.</p><button class="button primary" id="export-json">${icon('download')}Cópia completa · JSON</button> <button class="button" data-action="export-markdown">${icon('note')}Guia e notas · Markdown</button>`);dc.querySelector('#export-json').onclick=()=>exportArticle(a);break;case'export-markdown':saveFile('lume-'+slug(a.title)+'.md',markdown(a),'text/markdown;charset=utf-8');toast('Guia e anotações preparados para download.');break;case'download-original':saveFile(slug(a.title)+'.txt',a.text,'text/plain;charset=utf-8');break;case'ai':aiModal();break;case'flip':flipped=!flipped;study();break;case'card-prev':cardIndex=Math.max(0,cardIndex-1);flipped=false;study();break;case'card-next':cardIndex=(cardIndex+1)%a.guide.flashcards.length;flipped=false;study();break;case'card-again':case'card-known':a.review.cards={...(a.review.cards||{}),[cardIndex]:act==='card-known'?'known':'again'};persist();if(cardIndex===a.guide.flashcards.length-1){toast('Uma rodada feita. Volte aos cartões que quiser rever.');cardIndex=0}else cardIndex++;flipped=false;study();break;case'quiz-next':if(quizIndex===a.guide.quiz.length-1){modal('Mais uma conexão feita.',`<p class="dialog-description">Você respondeu às ${a.guide.quiz.length} perguntas desta rodada. Revise o feedback e anote o que ainda quer entender.</p><button class="button primary" id="review-notes">${icon('note')}Anotar o que aprendi</button>`);dc.querySelector('#review-notes').onclick=()=>{dialog.close();studyTab='notes';study()}}else{quizIndex++;quizAnswer=null;study()}break;case'quiz-restart':quizIndex=0;quizAnswer=null;study();break;}}
window.addEventListener('hashchange',()=>{stopSpeech();render();window.scrollTo(0,0)});dialog.addEventListener('click',e=>{if(e.target===dialog){const rect=dialog.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)dialog.close()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&focus){focus=false;study()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer()});window.addEventListener('pagehide',stopSpeech);
render();if(location.protocol!=='file:')fetch('/api/status',{signal:AbortSignal.timeout(3000)}).then(r=>r.ok?r.json():null).then(s=>{aiAvailable=Boolean(s?.aiAvailable);if(aiAvailable)render()}).catch(()=>{});
</script></body></html>
